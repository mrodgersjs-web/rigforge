[project]
name = "rigforge"
version = "1.1.0"
description = "Signed proof packets that catch AI coding agents when they claim work is done that is not."
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Mike Rodgers"}]
readme = "README.md"
keywords = ["rig", "forge", "agentic", "deterministic", "gev", "done-contract", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.10,<3.0",
    "click>=8.1,<9.0",
    "pyyaml>=6.0,<7.0",
    "rich>=13.0,<14.0",
]

[project.urls]
Homepage = "https://github.com/mrodgersjs-web/rigforge"
Issues = "https://github.com/mrodgersjs-web/rigforge/issues"
CI = "https://github.com/mrodgersjs-web/rigforge/actions"

[project.optional-dependencies]
mcp = [
    "mcp>=1.0,<2.0",
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.29,<1.0",
]
# Public attestation — ed25519 asymmetric signing for ProofPackets.
# rigforge.public_attest imports cryptography lazily; without this extra
# the import raises a clear error with install instructions.
public = [
    "cryptography>=42.0,<44.0",
]
# README documents `pip install -e ".[telemetry]"`; these are the packages
# rigforge/telemetry.py actually imports. The module probes for them once and
# degrades to a no-op when absent, so this stays optional -- but the documented
# install path has to resolve, or the docs are lying.
telemetry = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.16,<0.18",
    # Also the `public` extra's dependency (cryptography). Installing it here
    # keeps `pip install -e ".[dev]"` from skipping the public-attestation tests.
    "cryptography>=42.0,<44.0",
    # Required to run the FULL suite. rigforge/tests/test_webapp.py,
    # test_followups.py and test_hardening.py drive the cockpit API through
    # fastapi.TestClient, which is backed by httpx. Without these they
    # importorskip themselves and a green run silently covers less.
    # These are test-time only; they do not add a runtime dependency and the
    # tests stay fully in-process (no socket is ever opened).
    "fastapi>=0.110,<1.0",
    "httpx>=0.27",
]

[project.scripts]
rigforge = "rigforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rigforge", "contracts"]
# Non-.py assets under rigforge/ (web SPA) are already collected via the
# package path above. Do NOT also force-include rigforge/web — hatchling
# then adds the same files twice and the wheel build fails with:
#   ValueError: A second file is being added ... rigforge/web/app.js

[tool.pytest.ini_options]
testpaths = ["rigforge/tests", "contracts/v1/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# The narrow first gate CI enforces (blocking): the pycodestyle errors that
# flag real problems (E4 imports, E7 statements, E9 syntax/IO errors) plus the
# pyflakes checks that catch genuine bugs rather than style.
#
# The broader families (import sorting, pyupgrade, flake8-*) are not in this
# select, but they ARE enforced: CI's second lint step runs ruff's full default
# rule set with `--isolated`, blocking, and the codebase passes it clean
# (0 findings) since the 2026-10-20 lint repair. Keep both steps green.
select = ["E4", "E7", "E9", "F821", "F811", "F632", "F702"]
