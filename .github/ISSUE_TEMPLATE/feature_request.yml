name: Feature request
description: Suggest a capability or improvement
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first. If a proof, gate, or check would have to
        fail for the feature to be useful, say what should fail and how.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do today, and who it affects.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you want
      description: The behavior you would like, with a concrete example.
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: How it would prove itself
      description: The check a reviewer could run to see the feature works.
